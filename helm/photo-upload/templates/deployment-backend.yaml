apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photo-upload.backend.fullname" . }}
  labels:
    {{- include "photo-upload.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "photo-upload.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "photo-upload.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "photo-upload.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Values.backend.name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: 8081
          protocol: TCP
        env:
        - name: MARIADB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "photo-upload.fullname" . }}-config
              key: database.host
        - name: MARIADB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "photo-upload.fullname" . }}-config
              key: database.port
        - name: MARIADB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: {{ include "photo-upload.fullname" . }}-config
              key: database.name
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: database.user
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: database.password
        - name: JAVA_OPTS
          value: {{ .Values.backend.javaOpts | quote }}
        {{- if .Values.backend.sprintProfilesActive }}
        # When unset (default in R1), application.yml's `${SPRING_PROFILES_ACTIVE:api,worker}`
        # default takes effect → both profiles load into this pod. R2 sets this to "api".
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.backend.sprintProfilesActive | quote }}
        {{- end }}
        - name: FILE_UPLOAD_BASE_PATH
          value: {{ .Values.backend.persistence.mountPath | quote }}
        - name: APP_BASE_URL
          value: {{ .Values.backend.baseUrl | default "https://picz2.oglimmer.com" | quote }}
        - name: FILE_UPLOAD_MAX_CONCURRENT_PROCESSING
          value: {{ .Values.backend.maxConcurrentProcessing | default 1 | quote }}
        - name: FILE_UPLOAD_PROCESSING_QUEUE_CAPACITY
          value: {{ .Values.backend.processingQueueCapacity | default 50 | quote }}
        {{- if .Values.objectStorage.enabled }}
        - name: STORAGE_S3_ENABLED
          value: "true"
        - name: STORAGE_S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ include "photo-upload.fullname" . }}-config
              key: objectStorage.endpoint
        - name: STORAGE_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: {{ include "photo-upload.fullname" . }}-config
              key: objectStorage.bucket
        - name: STORAGE_S3_REGION
          valueFrom:
            configMapKeyRef:
              name: {{ include "photo-upload.fullname" . }}-config
              key: objectStorage.region
        - name: STORAGE_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: objectStorage.accessKey
        - name: STORAGE_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: objectStorage.secretKey
        {{- end }}
        {{- if .Values.objectStorage.backendSecretKey }}
        # Without this, the instance still runs on its own MinIO; users just cannot register their
        # own S3 endpoint, and the API says so instead of failing at upload time.
        - name: STORAGE_BACKEND_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: objectStorage.backendSecretKey
        {{- end }}
        {{- if .Values.apns.enabled }}
        # Apple push credentials. Api pod only — the worker sends no notifications. The key
        # arrives from the secret, so it is never in the image and rotating it is a secret edit
        # plus a restart, not a rebuild.
        - name: APNS_ENABLED
          value: "true"
        - name: APNS_KEY_ID
          value: {{ required "apns.keyId is required when apns.enabled" .Values.apns.keyId | quote }}
        - name: APNS_TEAM_ID
          value: {{ required "apns.teamId is required when apns.enabled" .Values.apns.teamId | quote }}
        # required, not defaulted: `helm upgrade --reuse-values` bases on the previous release's
        # values and does NOT pick up new defaults from the chart, so the first upgrade that
        # turned apns on shipped an empty topic — and APNs rejects every push without one, while
        # the api still logs a happy "client initialized". Fail the render instead.
        - name: APNS_TOPIC
          value: {{ required "apns.topic is required when apns.enabled (the app's bundle id, e.g. com.oglimmer.photosync) — note that --reuse-values does not supply the chart default" .Values.apns.topic | quote }}
        - name: APNS_PRODUCTION
          value: {{ .Values.apns.production | default false | quote }}
        - name: APNS_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: apns.privateKey
        {{- else }}
        # No key, so say so rather than letting the api try and log a failure every boot.
        - name: APNS_ENABLED
          value: "false"
        {{- end }}
        {{- if .Values.appleMaps.enabled }}
        # MapKit JS credentials for the gallery's map filter. Api pod only — the worker has no
        # HTTP surface that mints tokens. Leaving these unset disables the feature cleanly.
        - name: APPLE_MAPS_TEAM_ID
          value: {{ required "appleMaps.teamId is required when appleMaps.enabled" .Values.appleMaps.teamId | quote }}
        - name: APPLE_MAPS_KEY_ID
          value: {{ required "appleMaps.keyId is required when appleMaps.enabled" .Values.appleMaps.keyId | quote }}
        - name: APPLE_MAPS_ORIGIN
          value: {{ .Values.appleMaps.origin | quote }}
        - name: APPLE_MAPS_TTL_SECONDS
          value: {{ .Values.appleMaps.ttlSeconds | default 1800 | quote }}
        - name: APPLE_MAPS_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: appleMaps.privateKey
        # Server-side reverse geocoding (place names on the "by day & region" headings). Same
        # credentials; these only cap how often the cache misses through to Apple.
        - name: GEOCODE_ENABLED
          value: {{ .Values.appleMaps.geocode.enabled | default false | quote }}
        - name: GEOCODE_REUSE_RADIUS_METERS
          value: {{ .Values.appleMaps.geocode.reuseRadiusMeters | default 300 | quote }}
        - name: GEOCODE_MAX_LOOKUPS_PER_MINUTE
          value: {{ .Values.appleMaps.geocode.maxLookupsPerMinute | default 120 | quote }}
        - name: GEOCODE_MAX_REQUESTS_PER_MINUTE_PER_CLIENT
          value: {{ .Values.appleMaps.geocode.maxRequestsPerMinutePerClient | default 60 | quote }}
        - name: GEOCODE_DEFAULT_LANGUAGE
          value: {{ .Values.appleMaps.geocode.defaultLanguage | default "en" | quote }}
        {{- end }}
        {{- if .Values.tus.enabled }}
        # TUS resumable uploads (Phase 5). The hook controller validates the path-secret
        # against TUS_HOOK_SECRET; advertised gates whether /api/capabilities reports
        # tus.enabled=true to clients (R1 false → R2 true). Both flags ride together so the
        # api pod and tusd Deployment stay in lockstep.
        - name: TUS_ENABLED
          value: "true"
        - name: TUS_ADVERTISED
          value: {{ .Values.tus.advertised | quote }}
        - name: TUS_ENDPOINT
          value: {{ .Values.tus.endpoint | default "/files/" | quote }}
        - name: TUS_MAX_SIZE
          value: {{ .Values.tus.maxSize | default 2147483648 | int64 | quote }}
        - name: UPLOAD_TOKEN_TTL_HOURS
          value: {{ .Values.tus.uploadTokenTtlHours | default 24 | quote }}
        - name: TUS_HOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "photo-upload.fullname" . }}-secret
              key: tus.hookSecret
        {{- end }}
        # Liveness/readiness use the cheap probe groups (LivenessState/ReadinessState only,
        # no DB or disk indicators) so a slow database or Longhorn hiccup can't starve them.
        # Startup still hits the full /actuator/health so the pod isn't marked ready until
        # the DB and mail servers are reachable.
        # Boot budget = initialDelay + period × failureThreshold. Spring Boot's startup is
        # CPU-bound, and the api pod requests only 100m, so on a busy node it boots on whatever
        # CFS shares are left over — measured between 100 s (quiet node) and past 340 s (node at
        # 96%). The old 30 × 10 s = 310 s budget sat inside that spread, which turned a loaded
        # node into a restart loop of a perfectly healthy image. Kept generous on purpose: a slow
        # boot is a scheduling problem, and killing the pod does not make the node less busy.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: management
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: {{ .Values.backend.startupProbe.failureThreshold | default 60 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        volumeMounts:
        - name: uploads
          mountPath: {{ .Values.backend.persistence.mountPath }}
      volumes:
      - name: uploads
        {{- if and .Values.backend.persistence.enabled .Values.backend.persistence.mounted }}
        persistentVolumeClaim:
          claimName: {{ include "photo-upload.fullname" . }}-uploads
        {{- else }}
        # PVC kept in-cluster (persistence.enabled=true) but not mounted (persistence.mounted=false).
        # Backend uses an in-pod emptyDir for transient staging; durable photos / audio live in S3.
        emptyDir:
          sizeLimit: {{ .Values.backend.persistence.emptyDirSizeLimit | default "5Gi" }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
