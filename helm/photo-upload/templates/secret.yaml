apiVersion: v1
kind: Secret
metadata:
  name: {{ include "photo-upload.fullname" . }}-secret
  labels:
    {{- include "photo-upload.labels" . | nindent 4 }}
type: Opaque
data:
  database.user: {{ .Values.database.external.user | b64enc | quote }}
  database.password: {{ .Values.database.external.password | b64enc | quote }}
  {{- if .Values.objectStorage.enabled }}
  objectStorage.accessKey: {{ required "objectStorage.accessKey is required when objectStorage.enabled" .Values.objectStorage.accessKey | b64enc | quote }}
  objectStorage.secretKey: {{ required "objectStorage.secretKey is required when objectStorage.enabled" .Values.objectStorage.secretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.objectStorage.backendSecretKey }}
  # AES key that encrypts the secret access keys of user-registered ("bring your own") storage
  # backends. Rotating it makes every stored user credential unreadable — the users would have to
  # re-enter their secret keys — so treat it as permanent per environment. Generate with:
  #   openssl rand -base64 32
  objectStorage.backendSecretKey: {{ .Values.objectStorage.backendSecretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.apns.enabled }}
  # APNs signing key (the .p8 body). Same handling as the MapKit key below: it reaches the api pod
  # as an env var and never enters the image, so it can be rotated without a rebuild. Set with:
  #   --set-file apns.privateKey=AuthKey_XXXXXXXXXX.p8
  apns.privateKey: {{ required "apns.privateKey is required when apns.enabled" .Values.apns.privateKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.appleMaps.enabled }}
  # MapKit JS signing key (the .p8 body). Never leaves the api pod — the browser only ever sees
  # a short-lived ES256 token minted from it. Set with:
  #   --set-file appleMaps.privateKey=AuthKey_XXXXXXXXXX.p8
  appleMaps.privateKey: {{ required "appleMaps.privateKey is required when appleMaps.enabled" .Values.appleMaps.privateKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.tus.enabled }}
  # Path-secret for tusd → api hook callbacks. tusd POSTs to /api/tus/hooks/$TUS_HOOK_SECRET;
  # the api pod validates the path segment with constant-time compare. Cluster-internal only —
  # the hook URL is never exposed via Ingress. Generate per-environment with `openssl rand -hex 32`.
  tus.hookSecret: {{ required "tus.hookSecret is required when tus.enabled — generate with `openssl rand -hex 32`" .Values.tus.hookSecret | b64enc | quote }}
  {{- end }}
