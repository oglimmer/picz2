---
server:
  port: 8080
  compression:
    enabled: true
    mime-types: "text/html, text/xml, text/plain, text/css, text/javascript, application/javascript,\
      \ application/json, application/xml\n"
    excluded-user-agents: ""
  tomcat:
    threads:
      max: 25
      min-spare: 4
    max-connections: 60
    accept-count: 20
    connection-timeout: 20000
spring:
  profiles:
    # Phase 4a default: load both api and worker beans in one JVM. Phase 4e/R2 overrides this via
    # SPRING_PROFILES_ACTIVE on the per-pod Deployment env (api on the upload pod, worker on the
    # processing pod). Env always wins over this property.
    active: "${SPRING_PROFILES_ACTIVE:api,worker}"
  servlet:
    multipart:
      enabled: true
      max-file-size: "500MB"
      max-request-size: "500MB"
      file-size-threshold: 0
      location: "${FILE_UPLOAD_BASE_PATH:./uploads/}/.multipart-tmp"
  datasource:
    url: "jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3306}/${MARIADB_DATABASE:photoupload}"
    username: "${MARIADB_USER:photoupload}"
    password: "${MARIADB_PASSWORD:photoupload}"
    driver-class-name: "org.mariadb.jdbc.Driver"
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: "HikariPool-PhotoUpload"
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "validate"
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: "org.hibernate.dialect.MariaDBDialect"
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: "classpath:db/migration"
    validate-on-migrate: true
  mail:
    host: "${MAIL_HOST:192.168.178.52}"
    port: "${MAIL_PORT:25}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    from: "${MAIL_FROM:noreply@junta-online.net}"
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
file:
  upload:
    upload-dir: "${FILE_UPLOAD_BASE_PATH:./uploads/}"
    max-file-size: 524288000
    max-files-per-request: 100
    max-concurrent-processing: "${FILE_UPLOAD_MAX_CONCURRENT_PROCESSING:2}"
    processing-queue-capacity: "${FILE_UPLOAD_PROCESSING_QUEUE_CAPACITY:50}"
    duplicate-detection-enabled: "${FILE_UPLOAD_DUPLICATE_DETECTION_ENABLED:true}"
    thumbnailer: "${FILE_UPLOAD_THUMBNAILER:vips}"
storage:
  # AES key (base64, 16/24/32 bytes) used to encrypt the secret access keys of user-registered
  # storage backends. Without it the instance still runs on its own MinIO, but users cannot bring
  # their own S3 — the API says so rather than failing at upload time. Generate with:
  #   openssl rand -base64 32
  backend-secret-key: "${STORAGE_BACKEND_SECRET_KEY:}"
  s3:
    enabled: "${STORAGE_S3_ENABLED:false}"
    endpoint: "${STORAGE_S3_ENDPOINT:}"
    access-key: "${STORAGE_S3_ACCESS_KEY:}"
    secret-key: "${STORAGE_S3_SECRET_KEY:}"
    bucket: "${STORAGE_S3_BUCKET:photo-upload}"
    region: "${STORAGE_S3_REGION:us-east-1}"
    path-style-access: "${STORAGE_S3_PATH_STYLE_ACCESS:true}"
    auto-create-bucket: "${STORAGE_S3_AUTO_CREATE_BUCKET:true}"
    presign-seconds: "${STORAGE_S3_PRESIGN_SECONDS:3600}"
    api-call-attempt-timeout-seconds: "${STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_SECONDS:30}"
    api-call-timeout-seconds: "${STORAGE_S3_API_CALL_TIMEOUT_SECONDS:60}"
    max-connections: "${STORAGE_S3_MAX_CONNECTIONS:64}"
    connection-acquisition-timeout-seconds: "${STORAGE_S3_CONNECTION_ACQUISITION_TIMEOUT_SECONDS:5}"
retention:
  # Phase 6 / Gap 4-finish — nightly CronJob purges originals from MinIO once derivatives are
  # durable and the row is older than this many days. Conservative default per the plan; the
  # alert-first phase used 7 days as the canonical threshold.
  original-days: "${RETENTION_ORIGINAL_DAYS:7}"
  max-rows-per-run: "${RETENTION_MAX_ROWS_PER_RUN:5000}"
  dry-run: "${RETENTION_DRY_RUN:false}"
  # Phase 5 follow-up — second pass deletes abandoned tus-uploads/ objects older than this many
  # days. tusd 2.x has no in-process expiry and our MinIO is single-drive (no lifecycle API),
  # so this server-side sweep is the only GC mechanism for stale TUS uploads.
  tus-upload-days: "${RETENTION_TUS_UPLOAD_DAYS:7}"
capture-date:
  # EXIF DateTimeOriginal is a bare wall clock. iPhones also write OffsetTimeOriginal (0x9011),
  # which pins it to a real instant and always wins; this zone is only assumed for photos that
  # lack the tag (older cameras, editor-stripped files). Videos never use it — QuickTime carries
  # its own offset. Set to UTC to reproduce the pre-fix behaviour.
  fallback-zone: "${CAPTURE_DATE_FALLBACK_ZONE:Europe/Berlin}"
maps:
  apple:
    # MapKit JS credentials for the gallery's map filter. All three come from the Apple Developer
    # portal ("Maps IDs" / "MapKit JS" key); private-key is the body of the AuthKey_XXXX.p8 file.
    # Leave unset to disable — /api/capabilities then reports maps.enabled=false and the UI hides
    # the filter, which is the normal state for local dev.
    team-id: "${APPLE_MAPS_TEAM_ID:}"
    key-id: "${APPLE_MAPS_KEY_ID:}"
    private-key: "${APPLE_MAPS_PRIVATE_KEY:}"
    # Restricts the minted token to this web origin (scheme + host, no trailing slash). Optional,
    # but without it a token copied out of the browser works on any site.
    origin: "${APPLE_MAPS_ORIGIN:}"
    ttl-seconds: "${APPLE_MAPS_TTL_SECONDS:1800}"
  geocode:
    # Server-side reverse geocoding for the gallery's "by day & region" headings. Uses the same
    # Apple credentials as above; these settings only govern how hard we lean on Apple's quota.
    # Every limit below degrades to "no place name" (the UI shows coordinates), never to an error.
    enabled: "${GEOCODE_ENABLED:true}"
    base-url: "${GEOCODE_BASE_URL:https://maps-api.apple.com}"
    # A cached name this close to the asked-for point is reused instead of asking again. Photo
    # regions are 2 km across, so a few hundred metres describes the same place.
    reuse-radius-meters: "${GEOCODE_REUSE_RADIUS_METERS:300}"
    max-points-per-request: "${GEOCODE_MAX_POINTS_PER_REQUEST:60}"
    negative-ttl-days: "${GEOCODE_NEGATIVE_TTL_DAYS:7}"
    max-lookups-per-minute: "${GEOCODE_MAX_LOOKUPS_PER_MINUTE:120}"
    max-concurrent-lookups: "${GEOCODE_MAX_CONCURRENT_LOOKUPS:4}"
    max-requests-per-minute-per-client: "${GEOCODE_MAX_REQUESTS_PER_MINUTE_PER_CLIENT:60}"
    request-timeout-seconds: "${GEOCODE_REQUEST_TIMEOUT_SECONDS:5}"
    default-language: "${GEOCODE_DEFAULT_LANGUAGE:en}"
    memory-cache-size: "${GEOCODE_MEMORY_CACHE_SIZE:20000}"
jobs:
  poll:
    interval-ms: "${JOBS_POLL_INTERVAL_MS:2000}"
  lease:
    # 45 min. Must exceed the slowest single job — a 4K source transcode runs ~17 min on the
    # Pi, and a lease that expires mid-encode gets the job restarted on the other replica.
    seconds: "${JOBS_LEASE_SECONDS:2700}"
  max-attempts: "${JOBS_MAX_ATTEMPTS:3}"
  backpressure:
    queue-depth-threshold: "${JOBS_BACKPRESSURE_QUEUE_DEPTH_THRESHOLD:200}"
    refresh-ms: "${JOBS_BACKPRESSURE_REFRESH_MS:1000}"
upload-tokens:
  # §5.9 — how long a scoped upload token stays valid. Long enough that a queue of background
  # uploads finishes on one token; short enough that a token leaked out of a tusd .info object
  # is worthless by the time anyone finds it. Clients refresh on their own before it lapses.
  ttl-hours: "${UPLOAD_TOKEN_TTL_HOURS:24}"
tus:
  # Phase 5 — TUS resumable uploads. Manifests render based on Helm `tus.enabled`; the api pod
  # reads its own `tus.enabled` env var to decide whether to wire TusHookController. The pair
  # of flags lets R1 ship the Deployment without yet advertising TUS to clients.
  enabled: "${TUS_ENABLED:false}"
  advertised: "${TUS_ADVERTISED:false}"
  endpoint: "${TUS_ENDPOINT:/files/}"
  max-size: "${TUS_MAX_SIZE:2147483648}"
  hook-secret: "${TUS_HOOK_SECRET:}"
  version: "1.0.0"
logging:
  level:
    ROOT: "info"
    com.oglimmer.photoupload: "debug"
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
app:
  base-url: "${APP_BASE_URL:https://picz2.oglimmer.com}"
  mail:
    enabled: "${MAIL_ENABLED:true}"
  apns:
    # Push notifications to the iOS app (new photos, newly published albums). The signing key is
    # supplied the same way the MapKit one is — as the .p8 body from a secret, never from the JAR.
    # Leave the key unset to disable: the service then logs once and drops every push, which is
    # the normal state for local dev.
    enabled: "${APNS_ENABLED:true}"
    # Body of the AuthKey_XXXX.p8 file. Production injects it from the Kubernetes secret.
    private-key: "${APNS_PRIVATE_KEY:}"
    # Local-dev alternative: a filesystem path to the same .p8, which sits gitignored at the repo
    # root beside the MapKit key. Ignored when private-key is set.
    key-path: "${APNS_KEY_PATH:}"
    # Identifiers, not secrets — they name the key, they cannot sign with it.
    key-id: "${APNS_KEY_ID:289ZRKLFNQ}"
    team-id: "${APNS_TEAM_ID:SBFZ9G94BG}"
    topic: "${APNS_TOPIC:com.oglimmer.photosync}"
    production: "${APNS_PRODUCTION:false}"
management:
  server:
    port: 8081
    address: "0.0.0.0"
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  info:
    git:
      mode: "full"
springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: true
    operations-sorter: "alpha"
    tags-sorter: "alpha"
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
