name: ios

on:
  push:
    branches: [main, "renovate/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: xcodebuild test
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/Zyncloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # Build-config invariants that no unit test can reach (see ios/Zyncloud/README.md).
      - name: Guard scripts
        run: |
          Scripts/check-entitlements.sh
          Scripts/check-infoplist.sh

      # One build, tests run on both device families. Do NOT add
      # CODE_SIGNING_ALLOWED=NO: the keychain tests need the signed host app.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Zyncloud.xcodeproj \
            -scheme Zyncloud \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5)' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | tee xcodebuild.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-test-results
          path: |
            ios/Zyncloud/TestResults.xcresult
            ios/Zyncloud/xcodebuild.log
          if-no-files-found: ignore
